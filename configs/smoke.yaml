seed: 17
data_dir: data/demo/prepared
output_dir: runs/smoke
device: auto
num_threads: 2
seeds: [0]
teacher_epochs: 5
student_epochs: 5
patience: 5
batch_size: 32
learning_rate: 0.001
weight_decay: 0.0001
projection_dim: 16
kd_weight: 0.3
peer_weight: 0.1
contrast_weight: 0.05
temperature: 0.2
warmup_epochs: 1
top_k: 20
bootstrap_repeats: 200
experiments: [supervised, kd, mutual, contrastive, mutual_contrastive]
teachers:
  - {name: t_residual, architecture: residual, hidden: 64, dropout: 0.05}
  - {name: t_module, architecture: module, hidden: 64, dropout: 0.05}
  - {name: t_mlp, architecture: mlp, hidden: 64, dropout: 0.05}
  - {name: t_bilinear, architecture: bilinear, hidden: 64, dropout: 0.05}
students:
  - {name: s_residual, architecture: residual, hidden: 32, dropout: 0.05}
  - {name: s_module, architecture: module, hidden: 32, dropout: 0.05}
  - {name: s_mlp, architecture: mlp, hidden: 32, dropout: 0.05}
  - {name: s_bilinear, architecture: bilinear, hidden: 32, dropout: 0.05}

