[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcell-dual"
version = "0.4.0"
description = "Four-teacher four-student perturbation-response experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3", "numpy>=1.26,<3", "pandas>=2.1,<3",
  "scipy>=1.11,<2", "anndata>=0.10,<0.13",
  "PyYAML>=6,<7", "requests>=2.31,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
notebook = ["nbformat>=5,<6"]
agent = ["openai>=2,<3", "pydantic>=2,<3"]
foundation = ["transformers==4.57.3", "peft==0.18.0", "accelerate>=1.10,<2", "safetensors>=0.6,<1", "huggingface-hub>=0.34,<1"]

[project.scripts]
vcell = "vcell.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
