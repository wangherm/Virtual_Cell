[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcell-dual"
version = "0.2.1"
description = "Four-teacher four-student perturbation-response experiments"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3", "numpy>=1.26,<3", "pandas>=2.1,<3",
  "scipy>=1.11,<2", "anndata>=0.10,<0.13",
  "PyYAML>=6,<7", "requests>=2.31,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6"]
agent = ["openai>=2,<3", "pydantic>=2,<3"]

[project.scripts]
vcell = "vcell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
